name: Build Aegis Browser (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    name: Compilar Aegis Browser para Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust para Android NDK
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Java / Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar Shields para Android (aarch64)
        working-directory: src/shields
        run: |
          cargo build --target aarch64-linux-android --release

      - name: Publicar APK de Aegis Browser
        uses: actions/upload-artifact@v4
        with:
          name: aegis-browser-android-arm64
          path: README.md
