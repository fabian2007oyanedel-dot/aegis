name: Build Aegis Browser (Android ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/shields/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    name: Compilar Aegis Browser para Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Configurar Java / Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar Shields para Android ARM64
        working-directory: src/shields
        run: |
          cargo ndk -t arm64-v8a build --release

      - name: Subir Binario Shields Android
        uses: actions/upload-artifact@v4
        with:
          name: aegis-shields-android-arm64
          path: src/shields/target/aarch64-linux-android/release/libaegis_shields.a
          retention-days: 14
