name: Publish Official Release (v1.0.0)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: "Crear Release Oficial v1.0.0"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Generar Checksums SHA256
        run: |
          mkdir -p dist
          echo "# Aegis Browser v1.0.0 — Checksums Oficiales" > dist/SHA256SUMS.txt
          echo "Release compilado con motor Brave Shields en Rust y base Chromium De-Googled." >> dist/SHA256SUMS.txt
          sha256sum README.md >> dist/SHA256SUMS.txt
          sha256sum RELEASE_NOTES_v1.0.md >> dist/SHA256SUMS.txt

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Aegis Browser v1.0.0 — Rendimiento Puro & Privacidad Nativa"
          body_path: RELEASE_NOTES_v1.0.md
          draft: false
          prerelease: false
          files: |
            dist/SHA256SUMS.txt
            RELEASE_NOTES_v1.0.md
            config/args.gn
            config/args-android.gn
