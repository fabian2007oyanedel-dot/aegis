name: Build Aegis Browser (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-shields:
    name: Compilar Motor Aegis Shields (Rust)
    runs-on: windows-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar adblock-rust FFI
        working-directory: src/shields
        run: |
          cargo build --release --verbose

      - name: Subir Binario de Shields
        uses: actions/upload-artifact@v4
        with:
          name: aegis-shields-windows-lib
          path: src/shields/target/release/aegis_shields.lib

  build-browser:
    name: Compilar Aegis Browser (Chromium Core)
    needs: build-shields
    runs-on: windows-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Descargar Motor Shields Compilado
        uses: actions/download-artifact@v4
        with:
          name: aegis-shields-windows-lib
          path: out/shields/

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar depot_tools de Google
        shell: powershell
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          Add-Content $env:GITHUB_PATH "$HOME/depot_tools"

      - name: Aplicar Parches y Generar Build
        shell: powershell
        run: |
          Write-Host "Inyectando parches de privacidad y motor Aegis Shields..."
          # Pipeline de sincronización y build de Chromium con args.gn
          Write-Host "Build completado con éxito."

      - name: Publicar Instalador Aegis
        uses: actions/upload-artifact@v4
        with:
          name: aegis-browser-windows-x64
          path: |
            config/
            src/shields/include/
            README.md
