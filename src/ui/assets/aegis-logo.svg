<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Halo -->
  <path d="M256 32 L432 96 C432 288 340 416 256 480 C172 416 80 288 80 96 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Shield Body -->
  <path d="M256 48 L416 108 C416 280 332 396 256 456 C180 396 96 280 96 108 Z"
        fill="url(#coreGrad)" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Chevron Crest (Speed / Fast browsing) -->
  <path d="M256 120 L352 168 L256 400 L160 168 Z"
        fill="none" stroke="#00f2fe" stroke-width="6" stroke-linejoin="round" opacity="0.3"/>

  <!-- Core Emblem: Stylized 'A' for Aegis -->
  <path d="M256 150 L340 330 L300 330 L280 280 L232 280 L212 330 L172 330 Z M256 215 L242 250 L270 250 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Speed Energy Sparks -->
  <circle cx="256" cy="150" r="8" fill="#ffffff" />
  <circle cx="256" cy="456" r="6" fill="#00f2fe" />
</svg>
