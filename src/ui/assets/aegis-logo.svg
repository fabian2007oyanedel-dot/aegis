<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Ala Izquierda (Cian Neón a Azul Cobalto Eléctrico) -->
    <linearGradient id="aegis_left_flow" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Gradiente Ala Derecha (Azul Neón a Violeta Espacial) -->
    <linearGradient id="aegis_right_flow" x1="40%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gradiente Cinta Travesaño (Flujo de Conexión) -->
    <linearGradient id="aegis_cross_flow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Sombra de flotación ambiental exterior -->
    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.36" />
    </filter>

    <!-- Sombra de pliegue tridimensional entre las alas de la 'A' -->
    <filter id="ribbonFold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <g id="aegis-master-crest" filter="url(#ambientShadow)">
    
    <!-- 1. PATA DERECHA DE LA 'A' (Fluye desde la cúspide con ángulo aerodinámico y pie redondeado) -->
    <path d="M 256, 60
             C 272, 60 286, 72 296, 92
             L 396, 360
             C 412, 402 386, 444 346, 444
             C 324, 444 304, 428 296, 406
             L 264, 318
             L 230, 222
             L 256, 126
             Z"
          fill="url(#aegis_right_flow)" />

    <!-- 2. PATA IZQUIERDA DE LA 'A' (Superpuesta en el vértice con pliegue 3D suave, formando la silueta de escudo) -->
    <path d="M 120, 412
             C 102, 368 116, 320 144, 252
             L 216, 92
             C 226, 72 240, 60 256, 60
             C 272, 60 284, 70 292, 88
             L 266, 154
             L 204, 308
             L 166, 406
             C 158, 428 138, 444 116, 444
             C 102, 444 94, 436 94, 426
             C 94, 420 98, 414 104, 410
             Z"
          fill="url(#aegis_left_flow)"
          filter="url(#ribbonFold)" />

    <!-- 3. TRAVESAÑO ESCULTURAL DE LA 'A' (Cinta curvada suave que abraza ambas patas y cierra el escudo) -->
    <path d="M 154, 290
             C 154, 274 168, 262 184, 262
             L 328, 262
             C 344, 262 358, 274 358, 290
             C 358, 306 344, 318 328, 318
             L 184, 318
             C 168, 318 154, 306 154, 290 Z"
          fill="url(#aegis_cross_flow)"
          filter="url(#ribbonFold)" />
  </g>
</svg>
